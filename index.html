<!DOCTYPE html>
<html lang="en">
<head>
    <title>Análise Estatística</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">
</head>
<body>
    <div class="container">   
        <header>
            <h1>Análise Estatística</h1>
            <h2>Questão 1</h2>
        </header>
        <main>
            <div class="container">
                <div id="form_math" class="container">
                    <form id="form_math" method="post">
                            <div class="input-group">
                                <span class="input-group-text">Inserir dados</span>
                                <textarea class="form-control" aria-label="With textarea"></textarea>
                            </div>
                            <p><br>Ou</p>
                            <div class="input-group sm">
                                <input type="file" class="form-control" id="inputGroupFile02" name="arquivo">
                                <label class="input-group-text" for="inputGroupFile02">Upload</label>
                            </div>
                            <p></p>
                            <div class="mb-3 d-inline-block">
                                <div class="btn-group" role="group" aria-label="Basic checkbox toggle button group">
                                    <input type="checkbox" class="btn-check" id="calc_media" checked autocomplete="off">
                                    <label class="btn btn-outline-primary" for="calc_media">Calcular Media</label>
                                    <input type="checkbox" class="btn-check" id="calc_mediana" checked autocomplete="off">
                                    <label class="btn btn-outline-primary" for="calc_mediana">Calcular Mediana</label>
                                    <input type="checkbox" class="btn-check" id="calc_moda" checked autocomplete="off">
                                    <label class="btn btn-outline-primary" for="calc_moda">Calcular Moda</label>
                                    <input type="checkbox" class="btn-check" id="calc_max" checked autocomplete="off">
                                    <label class="btn btn-outline-primary" for="calc_max">Calcular Maximo</label>
                                    <input type="checkbox" class="btn-check" id="calc_min" checked autocomplete="off">
                                    <label class="btn btn-outline-primary" for="calc_min">Calcular Mínimo</label>
                                    <input type="checkbox" class="btn-check" id="calc_perc" checked autocomplete="off">
                                    <label class="btn btn-outline-primary" for="calc_perc">Calcular Percentis</label>
                                    <input type="checkbox" class="btn-check" id="frequency" checked autocomplete="off">
                                    <label class="btn btn-outline-primary" for="frequency">Tabela de Frequência</label>
                                </div>
                            </div>
                            <div class="mb-3">
                                <button type="submit" class="btn btn-primary">Prosseguir</button>
                            </div>
                        </div>
                    </form>
                </div>
                <div id="result" class="table-responsive">
                    <table class="table caption-top">
                    </table>
                </div>
                <div id="percentis" class="table-responsive">
                    <table class="table caption-top">
                    </table>
                </div>
                <div id="desc-percent">
                    <table class="table caption-top">
                        <!-- <caption>Descrição do Percentil 45:</caption> -->
                    </table>
                </div>
                <div id="frequence">
                    <table class="table caption-top">
                    </table>
                </div>
            </div>
        </main>
    </div>
    <footer class="fixed-bottom bg-dark text-white text-center">
        <p>&copy; 2023 Eu, Gustavo Borges UC20104546</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm" crossorigin="anonymous"></script>
    <script src='https://unpkg.com/simple-statistics@7.8.2/dist/simple-statistics.min.js'></script>
    <script src="script.js"></script>
</body>
</html>
